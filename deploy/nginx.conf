# /etc/nginx/sites-available/returnflow  →  symlink into sites-enabled
# Replace returns.example.com with the client's domain. Certbot fills in the SSL lines.

server {
    listen 80;
    listen [::]:80;
    server_name returns.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name returns.example.com;

    ssl_certificate     /etc/letsencrypt/live/returns.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/returns.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Photo uploads (customer portal allows 4 × 8 MB per item)
    client_max_body_size 40m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
